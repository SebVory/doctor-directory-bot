<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Kde končí moje část: nemocnice, naše část, platforma Wonderful</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#8a8a8a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1280" height="620" fill="#ffffff"/>

  <!-- Nemocnice -->
  <rect x="40" y="60" width="320" height="400" rx="22" fill="#f1f0ec" stroke="#cfcdc6"/>
  <text x="200" y="110" text-anchor="middle" font-size="26" font-weight="700" fill="#2a2a2a">Nemocnice</text>
  <text x="200" y="140" text-anchor="middle" font-size="18" fill="#666">černá skříňka</text>
  <rect x="70" y="180" width="260" height="110" rx="14" fill="#fdecea" stroke="#e0b4ad"/>
  <text x="200" y="228" text-anchor="middle" font-size="24" font-weight="700" fill="#9b3b2a">GET /doctors</text>
  <text x="200" y="262" text-anchor="middle" font-size="18" fill="#9b3b2a">celý JSON, ~10 min</text>
  <text x="200" y="350" text-anchor="middle" font-size="18" fill="#666">v repu: mock-hospital-api</text>
  <text x="200" y="380" text-anchor="middle" font-size="18" fill="#666">nic dalšího neudělají</text>

  <!-- arrow hospital -> ours -->
  <line x1="332" y1="235" x2="428" y2="235" stroke="#8a8a8a" stroke-width="2" marker-end="url(#a)"/>
  <text x="380" y="210" text-anchor="middle" font-size="15" fill="#555">plánovaný</text><text x="380" y="228" text-anchor="middle" font-size="15" fill="#555">ingest</text>

  <!-- Naše část -->
  <rect x="432" y="60" width="440" height="520" rx="22" fill="#f1f0ec" stroke="#cfcdc6"/>
  <text x="652" y="110" text-anchor="middle" font-size="26" font-weight="700" fill="#2a2a2a">Implementovaná část (repo)</text>

  <rect x="462" y="150" width="380" height="90" rx="14" fill="#e4f3ee" stroke="#8fc7b3"/>
  <text x="652" y="188" text-anchor="middle" font-size="22" font-weight="700" fill="#1d5c46">ingest → SQLite snapshot</text>
  <text x="652" y="218" text-anchor="middle" font-size="17" fill="#1d5c46">validace, guardy, atomický swap</text>

  <line x1="652" y1="242" x2="652" y2="278" stroke="#8a8a8a" stroke-width="2" marker-end="url(#a)"/>

  <rect x="462" y="282" width="380" height="90" rx="14" fill="#e4f3ee" stroke="#8fc7b3"/>
  <text x="652" y="320" text-anchor="middle" font-size="19" font-weight="700" fill="#1d5c46">find_doctors · get_doctor_contact</text>
  <text x="652" y="350" text-anchor="middle" font-size="17" fill="#1d5c46">fuzzy, potvrzení, best_question</text>

  <line x1="652" y1="374" x2="652" y2="410" stroke="#8a8a8a" stroke-width="2" marker-end="url(#a)"/>

  <rect x="462" y="414" width="380" height="90" rx="14" fill="#e4f3ee" stroke="#8fc7b3"/>
  <text x="652" y="452" text-anchor="middle" font-size="22" font-weight="700" fill="#1d5c46">prompt agenta · evals</text>
  <text x="652" y="482" text-anchor="middle" font-size="17" fill="#1d5c46">chování, ne text</text>

  <text x="652" y="548" text-anchor="middle" font-size="17" fill="#666">ve Wonderful: Skill + scheduled job</text>

  <!-- arrow ours <-> platform -->
  <line x1="846" y1="459" x2="940" y2="459" stroke="#8a8a8a" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>

  <!-- Platforma Wonderful -->
  <rect x="944" y="60" width="296" height="520" rx="22" fill="#f1f0ec" stroke="#cfcdc6"/>
  <text x="1092" y="110" text-anchor="middle" font-size="24" font-weight="700" fill="#2a2a2a">Platforma Wonderful</text>
  <text x="1092" y="140" text-anchor="middle" font-size="18" fill="#666">v repu nahrazeno CLI</text>

  <rect x="972" y="180" width="240" height="70" rx="14" fill="#e8f0fb" stroke="#9fb9e0"/>
  <text x="1092" y="224" text-anchor="middle" font-size="21" font-weight="700" fill="#1f3f7a">telefonie · SIP</text>
  <rect x="972" y="268" width="240" height="70" rx="14" fill="#e8f0fb" stroke="#9fb9e0"/>
  <text x="1092" y="312" text-anchor="middle" font-size="21" font-weight="700" fill="#1f3f7a">STT · TTS</text>
  <rect x="972" y="356" width="240" height="70" rx="14" fill="#e8f0fb" stroke="#9fb9e0"/>
  <text x="1092" y="400" text-anchor="middle" font-size="21" font-weight="700" fill="#1f3f7a">orchestrátor</text>
  <rect x="972" y="444" width="240" height="70" rx="14" fill="#e8f0fb" stroke="#9fb9e0"/>
  <text x="1092" y="488" text-anchor="middle" font-size="19" font-weight="700" fill="#1f3f7a">review queue · metriky</text>
</svg>
