# CodeRabbit skipped the first pull request with "auto reviews are disabled on
# base/target branches other than the default branch", even though the base was
# main and main is the default. The repository started life on master, so the
# likeliest cause is a stale idea of which branch that is. Naming the base
# branches explicitly settles it either way.
language: en-US

reviews:
  profile: chill
  high_level_summary: true
  review_status: true
  # Nothing in this repository rhymes.
  poem: false

  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main

  path_filters:
    # Generated by scripts/make-sample.ts and never hand-edited: 500 stratified
    # rows, reviewing them line by line is noise. The script is worth reviewing.
    - "!data/**"
    - "!package-lock.json"

  path_instructions:
    - path: "src/**/*.ts"
      instructions: >-
        ESM with strict and noUncheckedIndexedAccess. No any, no non-null
        assertion. Nothing may call the hospital endpoint during a call: reads
        go to the SQLite snapshot, and the agent reaches data only through
        tools, never raw SQL from a prompt.

    - path: "src/emergency.ts"
      instructions: >-
        A pre-model dispatcher for acute symptoms. The asymmetry is the whole
        design: a false positive tells someone who did not need it to call 155,
        a false negative leaves someone bleeding on the line talking to a
        directory. Weigh any narrowing against missed emergencies first, and
        treat a rule that keys on a bare keyword as a bug.

    - path: "evals/cases.json"
      instructions: >-
        Behavioural cases in Czech, 42 of the 44 taken verbatim from real STT
        transcripts. Flag an expectation that the snapshot cannot satisfy, and
        flag a case that would pass for a reason other than the one its note
        gives.

    - path: "tests/**/*.ts"
      instructions: >-
        Tests read the committed 500-row sample, never the full snapshot. Flag
        a test that pins current behaviour as correct without saying why it is
        correct, and one that could pass for the wrong reason.
